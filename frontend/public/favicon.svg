<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110px" height="110px">
  <defs>
    <!-- Gradiente Principal -->
    <linearGradient id="nexusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Efeito de Brilho (Neon) -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo (Opcional, para visualização rápida) -->
  <!-- <rect width="100%" height="100%" rx="16" fill="#0d1117"/> -->

  <!-- Grupo do Ícone Centralizado -->
  <g transform="translate(5, 2.5)">
    <!-- Hexágono Externo (A Rede) -->
    <polygon points="50,5 93,30 93,80 50,105 7,80 7,30" fill="none" stroke="#21262d" stroke-width="4" />
    <polygon points="50,5 93,30 93,80 50,105 7,80 7,30" fill="none" stroke="url(#nexusGradient)" stroke-width="1.5" opacity="0.5" />

    <!-- Linhas de Conexão do Nexus (Base) -->
    <line x1="50" y1="5" x2="50" y2="105" stroke="#21262d" stroke-width="2" />
    <line x1="7" y1="30" x2="93" y2="80" stroke="#21262d" stroke-width="2" />
    <line x1="7" y1="80" x2="93" y2="30" stroke="#21262d" stroke-width="2" />

    <!-- Checkmark (A Tarefa, com Brilho) -->
    <path d="M 22 55 L 43 76 L 85 30" fill="none" stroke="url(#nexusGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Nódulos/Agentes (Pontos de conexão brancos) -->
    <circle cx="22" cy="55" r="4.5" fill="#ffffff" />
    <circle cx="43" cy="76" r="4.5" fill="#ffffff" />
    <circle cx="85" cy="30" r="4.5" fill="#ffffff" />
    
    <!-- Centro do Nexus (Ponto focal brilhante) -->
    <circle cx="50" cy="55" r="6" fill="#00f2fe" filter="url(#glow)" opacity="0.9"/> 
  </g>
</svg>
