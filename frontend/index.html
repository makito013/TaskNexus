<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA installability (Phase 2): manifest + theme-color make the app
         installable on Chromium/Android. Safari on iOS ignores both — it
         only reads its own apple-touch-icon/apple-mobile-web-app-* tags
         below, hence the duplication instead of relying on the manifest
         alone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f7f6" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TaskNexus" />
    <title>TaskNexus</title>
    <!-- Fundo pré-JS combinando com o default claro v2 (oklch(0.968 0.007 85) ~ #f7f7f6) -->
    <style>
      html, body { background: #f7f7f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
