<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Fluxo do visualizador: o frontend pede metadados do arquivo e escolhe o renderizador pelo tipo; downloads usam Content-Disposition e o menu de compartilhar do iPad">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b3530"/></marker>
  </defs>
  <style>
    text{font-family:Figtree,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#3b3530}
    .m{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    .h{font-size:13px;font-weight:700}
    .s{font-size:11.5px;fill:#6b645c}
    .t{font-size:15px;font-weight:700}
  </style>
  <rect width="1000" height="560" rx="14" fill="#f7f5f0"/>
  <text x="24" y="34" class="t">Como um arquivo chega à tela</text>

  <rect x="24" y="56" width="200" height="74" rx="10" fill="#ffffff" stroke="#d8d3c8"/>
  <text x="40" y="80" class="h">Origem do clique</text>
  <text x="40" y="100" class="s">árvore · busca ⌘P · link</text>
  <text x="40" y="118" class="s">no chat · card do board</text>

  <rect x="270" y="56" width="230" height="74" rx="10" fill="#ffffff" stroke="#3f8f7c" stroke-width="1.5"/>
  <text x="286" y="80" class="h">GET …/content?path=</text>
  <text x="286" y="100" class="s">devolve mime, tamanho, is_text,</text>
  <text x="286" y="118" class="s">texto (até 1 MB) e sha</text>
  <line x1="226" y1="93" x2="266" y2="93" stroke="#3b3530" stroke-width="1.5" marker-end="url(#a)"/>

  <polygon points="620,56 700,93 620,130 540,93" fill="#ffffff" stroke="#3b3530"/>
  <text x="620" y="97" class="h" text-anchor="middle">tipo?</text>
  <line x1="502" y1="93" x2="536" y2="93" stroke="#3b3530" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- branches -->
  <g>
    <rect x="24" y="190" width="180" height="120" rx="10" fill="#eef6f2" stroke="#3f8f7c"/>
    <text x="38" y="214" class="h">.md / .markdown</text>
    <text x="38" y="234" class="s">marked (GFM) + DOMPurify</text>
    <text x="38" y="252" class="s">Shiki nos blocos</text>
    <text x="38" y="270" class="s">mermaid sob demanda</text>
    <text x="38" y="288" class="s">links relativos → viewer</text>

    <rect x="218" y="190" width="180" height="120" rx="10" fill="#eef6f2" stroke="#3f8f7c"/>
    <text x="232" y="214" class="h">.html / .htm</text>
    <text x="232" y="234" class="s">iframe sandbox=</text>
    <text x="232" y="252" class="s m">"allow-scripts"</text>
    <text x="232" y="270" class="s">src = /raw/… (CSS e</text>
    <text x="232" y="288" class="s">imagens relativas ok)</text>

    <rect x="412" y="190" width="180" height="120" rx="10" fill="#eef6f2" stroke="#3f8f7c"/>
    <text x="426" y="214" class="h">código / texto</text>
    <text x="426" y="234" class="s">Shiki + números de linha</text>
    <text x="426" y="252" class="s">#L42 rola e destaca</text>
    <text x="426" y="270" class="s">quebra de linha opcional</text>
    <text x="426" y="288" class="s">seleção nativa</text>

    <rect x="606" y="190" width="180" height="120" rx="10" fill="#eef0fa" stroke="#5b6fbf"/>
    <text x="620" y="214" class="h">imagem / pdf / vídeo</text>
    <text x="620" y="234" class="s">&lt;img&gt;, &lt;video&gt; ou</text>
    <text x="620" y="252" class="s">&lt;iframe&gt; do PDF nativo</text>
    <text x="620" y="270" class="s">pinça para zoom</text>

    <rect x="800" y="190" width="176" height="120" rx="10" fill="#fbeeea" stroke="#e2b8ad"/>
    <text x="814" y="214" class="h">binário ou &gt; 1 MB</text>
    <text x="814" y="234" class="s">sem preview</text>
    <text x="814" y="252" class="s">mostra tamanho e tipo</text>
    <text x="814" y="270" class="s">botão Baixar em destaque</text>
  </g>
  <path d="M620 130 V160 H114 V186" fill="none" stroke="#3b3530" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M308 160 V186" fill="none" stroke="#3b3530" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M502 160 V186" fill="none" stroke="#3b3530" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M620 160 H696 V186" fill="none" stroke="#3b3530" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M696 160 H888 V186" fill="none" stroke="#3b3530" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- download lane -->
  <rect x="24" y="350" width="952" height="190" rx="12" fill="#ffffff" stroke="#d8d3c8"/>
  <text x="44" y="378" class="t">Baixar e compartilhar no iPad</text>
  <rect x="44" y="396" width="200" height="60" rx="8" fill="#f3f1ec"/>
  <text x="58" y="420" class="h">Botão Baixar</text>
  <text x="58" y="440" class="s m">&lt;a href=raw?download=1&gt;</text>
  <rect x="290" y="396" width="250" height="60" rx="8" fill="#f3f1ec"/>
  <text x="304" y="420" class="h">Backend responde</text>
  <text x="304" y="440" class="s m">Content-Disposition: attachment</text>
  <rect x="586" y="396" width="370" height="60" rx="8" fill="#f3f1ec"/>
  <text x="600" y="420" class="h">Safari mostra "Baixar"</text>
  <text x="600" y="440" class="s">arquivo vai para o app Arquivos › Downloads</text>
  <line x1="246" y1="426" x2="286" y2="426" stroke="#3b3530" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="542" y1="426" x2="582" y2="426" stroke="#3b3530" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="44" y="468" width="200" height="56" rx="8" fill="#f3f1ec"/>
  <text x="58" y="490" class="h">Botão Compartilhar</text>
  <text x="58" y="510" class="s m">navigator.share({files})</text>
  <rect x="290" y="468" width="666" height="56" rx="8" fill="#f3f1ec"/>
  <text x="304" y="490" class="h">Menu nativo do iPadOS</text>
  <text x="304" y="510" class="s">AirDrop, Salvar em Arquivos, WhatsApp, Mail. Pasta inteira: GET …/zip?path=</text>
  <line x1="246" y1="496" x2="286" y2="496" stroke="#3b3530" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
