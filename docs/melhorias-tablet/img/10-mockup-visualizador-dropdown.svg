<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Visualizador acionado pelo agente: à esquerda, dropdown aberto abaixo do botão Visualizador no cabeçalho do chat, com abas de arquivos; à direita, o mesmo conteúdo em modal de tela cheia com botão Fechar">
  <style>
    text{font-family:Figtree,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#3b3530}
