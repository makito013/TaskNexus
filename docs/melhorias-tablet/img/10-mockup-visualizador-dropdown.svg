    .cap{font-size:13px;font-weight:700;fill:#6b645c}
  </style>
  <rect width="1200" height="620" rx="16" fill="#e9e5dc"/>

  <!-- ===== LEFT: dropdown ===== -->
  <rect x="20" y="20" width="570" height="540" rx="22" fill="#1f2024"/>
  <rect x="32" y="32" width="546" height="516" rx="12" fill="#f7f5f0"/>
  <!-- header -->
  <line x1="32" y1="76" x2="578" y2="76" stroke="#e2ddd3"/>
  <text x="48" y="60" class="h">Chat</text>
  <rect x="330" y="44" width="104" height="24" rx="8" fill="#e6f2ee" stroke="#3f8f7c"/>
  <text x="340" y="61" class="b" style="font-weight:700;fill:#2f7564">Visualizador</text>
  <circle cx="428" cy="46" r="8" fill="#3f8f7c"/><text x="425" y="50" class="s w" style="font-weight:700">3</text>
  <rect x="442" y="44" width="66" height="24" rx="8" fill="none" stroke="#d8d3c8"/>
  <text x="452" y="61" class="b">Anexos</text>
  <rect x="514" y="44" width="56" height="24" rx="8" fill="none" stroke="#d8d3c8"/>
  <text x="522" y="61" class="b">Ajustar</text>
  <!-- terminal behind -->
  <rect x="44" y="88" width="522" height="448" rx="8" fill="#26282e"/>
  <text x="56" y="112" class="m" style="font-size:11px;fill:#9fd9c5">⏺ abrir_no_visualizador(docs/plano.md)</text>
  <text x="56" y="130" class="m" style="font-size:11px;fill:#b9b4ab">  ⎿ Aberto no visualizador do usuário</text>
