  <text x="936" y="112" class="b">⤓  ⧉  ↗</text>
  <rect x="1006" y="98" width="142" height="22" rx="7" fill="#f3f1ec"/>
  <text x="1016" y="113" class="s" style="fill:#3b3530">Preview · Código</text>
  <!-- iframe content -->
  <rect x="642" y="128" width="506" height="400" rx="8" fill="#fbfaf7" stroke="#e2ddd3"/>
  <rect x="642" y="128" width="506" height="54" rx="8" fill="#44579f"/>
  <text x="662" y="161" style="font-size:18px;font-weight:700;fill:#ffffff">Relatório de testes</text>
  <rect x="662" y="200" width="150" height="80" rx="8" fill="#ffffff" stroke="#e2ddd3"/>
  <text x="676" y="228" class="s">Passaram</text>
  <text x="676" y="260" style="font-size:24px;font-weight:700;fill:#2f7564">58</text>
  <rect x="822" y="200" width="150" height="80" rx="8" fill="#ffffff" stroke="#e2ddd3"/>
  <text x="836" y="228" class="s">Falharam</text>
  <text x="836" y="260" style="font-size:24px;font-weight:700;fill:#b4531f">2</text>
  <rect x="982" y="200" width="150" height="80" rx="8" fill="#ffffff" stroke="#e2ddd3"/>
  <text x="996" y="228" class="s">Duração</text>
  <text x="996" y="260" style="font-size:24px;font-weight:700">4,2 s</text>
  <rect x="662" y="300" width="470" height="12" rx="4" fill="#ece8df"/>
  <rect x="662" y="322" width="400" height="12" rx="4" fill="#ece8df"/>
  <rect x="662" y="344" width="440" height="12" rx="4" fill="#ece8df"/>
  <text x="1140" y="46" class="ann">D</text>

  <text x="305" y="590" class="cap" text-anchor="middle">1 · Dropdown no cabeçalho do chat (iPad / PC)</text>
