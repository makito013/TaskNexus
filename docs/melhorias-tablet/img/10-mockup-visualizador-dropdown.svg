  <text x="186" y="111" class="b" style="fill:#2f7564">×</text>
  <rect x="208" y="92" width="130" height="28" rx="8" fill="#f3f1ec"/>
  <text x="218" y="111" class="b">relatorio.html</text>
  <text x="322" y="111" class="b" style="fill:#8a8378">×</text>
  <rect x="344" y="92" width="112" height="28" rx="8" fill="#f3f1ec"/>
  <text x="354" y="111" class="b">main.py:42</text>
  <text x="440" y="111" class="b" style="fill:#8a8378">×</text>
