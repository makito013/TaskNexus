  <text x="80" y="244" class="b">Ver <tspan class="lk">README.md</tspan> e <tspan class="lk">https://exemplo.com</tspan></text>
  <text x="80" y="276" class="h">Checklist</text>
  <text x="80" y="298" class="b">☑ Tool MCP abrir_no_visualizador</text>
