  <text x="424" y="150" class="b">⧉</text>
  <text x="448" y="150" class="b">↗</text>
  <rect x="478" y="136" width="80" height="22" rx="7" fill="#3f8f7c"/>
  <text x="488" y="151" class="s w" style="font-weight:700">⤢ Tela cheia</text>
