  <text x="92" y="352" class="s" style="fill:#b9b4ab">bash                                             Copiar</text>
  <text x="92" y="376" class="m" style="font-size:11px;fill:#e6e3dd">cd backend &amp;&amp; .venv/bin/pytest -q</text>
  <text x="92" y="396" class="m" style="font-size:11px;fill:#e6e3dd">cd frontend &amp;&amp; npm test</text>
  <rect x="80" y="432" width="468" height="70" rx="8" fill="none" stroke="#e2ddd3"/>
  <rect x="80" y="432" width="468" height="24" rx="8" fill="#f3f1ec"/>
  <text x="92" y="449" class="b" style="font-weight:700">Risco</text>
  <text x="320" y="449" class="b" style="font-weight:700">Mitigação</text>
  <text x="92" y="476" class="b">HTML com script</text>
  <text x="320" y="476" class="b">iframe sandbox</text>

  <text x="364" y="40" class="ann">A</text>
  <text x="62" y="90" class="ann">B</text>
  <text x="560" y="134" class="ann">C</text>

