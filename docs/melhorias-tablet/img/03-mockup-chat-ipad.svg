<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 840" role="img" aria-label="Mockup do chat no iPad na horizontal: lista de conversas à esquerda, conversa com bolhas, bloco de código, cartões de ferramenta e pedido de aprovação no centro, composer embaixo">
  <style>
    text{font-family:Figtree,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#3b3530}
    .m{white-space:pre;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    .h{font-size:15px;font-weight:700}
    .b{font-size:13px}
    .s{font-size:11.5px;fill:#8a8378}
    .w{fill:#ffffff}
    .lk{fill:#3d56b0;text-decoration:underline}
    .c{font-size:12px;fill:#e6e3dd}
    .ck{fill:#9fd9c5}
    .cs{fill:#e7c07b}
    .ann{font-size:12px;font-weight:700;fill:#b4531f}
  </style>
  <rect width="1200" height="840" rx="18" fill="#e9e5dc"/>
  <!-- device -->
  <rect x="30" y="24" width="1140" height="790" rx="34" fill="#1f2024"/>
  <rect x="46" y="40" width="1108" height="758" rx="22" fill="#f7f5f0"/>

  <!-- chats list -->
  <rect x="46" y="40" width="300" height="758" rx="22" fill="#fbfaf7"/>
  <rect x="330" y="40" width="16" height="758" fill="#fbfaf7"/>
  <line x1="346" y1="40" x2="346" y2="798" stroke="#e2ddd3"/>
  <text x="66" y="80" class="h">Conversas</text>
  <rect x="290" y="62" width="36" height="28" rx="8" fill="#3f8f7c"/>
  <text x="301" y="81" class="h w">+</text>
  <rect x="66" y="98" width="260" height="32" rx="9" fill="#efece5"/>
  <text x="80" y="119" class="b" style="fill:#8a8378">Buscar conversas e arquivos</text>

  <!-- chat item active -->
  <rect x="58" y="142" width="280" height="68" rx="10" fill="#e6f2ee"/>
  <circle cx="86" cy="176" r="18" fill="#cfe6de"/><text x="76" y="181" class="b" style="font-weight:700;fill:#2f7564">CL</text>
  <text x="114" y="166" class="b" style="font-weight:700">claude · tasknexus</text>
  <text x="114" y="186" class="s">Rodei os testes, 2 falharam em…</text>
  <text x="298" y="166" class="s">agora</text>
  <text x="114" y="202" class="s" style="fill:#2f7564">● pensando…</text>

  <circle cx="86" cy="246" r="18" fill="#dfe3f5"/><text x="77" y="251" class="b" style="font-weight:700;fill:#44579f">CX</text>
  <text x="114" y="236" class="b" style="font-weight:700">codex · site-cliente</text>
  <text x="114" y="256" class="s">Quer que eu faça o deploy?</text>
  <text x="296" y="236" class="s">14:02</text>
  <circle cx="312" cy="254" r="9" fill="#c9962d"/><text x="309" y="258" class="s w" style="font-weight:700">!</text>

  <circle cx="86" cy="310" r="18" fill="#cfe6de"/><text x="76" y="315" class="b" style="font-weight:700;fill:#2f7564">CL</text>
  <text x="114" y="300" class="b" style="font-weight:700">claude · api-pagamentos</text>
  <text x="114" y="320" class="s">Pronto. Criei o card #184.</text>
  <text x="300" y="300" class="s">ontem</text>
  <circle cx="312" cy="318" r="9" fill="#3f8f7c"/><text x="309" y="322" class="s w" style="font-weight:700">2</text>

  <circle cx="86" cy="374" r="18" fill="#eeeae2"/><text x="79" y="379" class="b" style="font-weight:700;fill:#6b645c">&gt;_</text>
  <text x="114" y="364" class="b" style="font-weight:700">terminal · scripts</text>
  <text x="114" y="384" class="s">modo terminal</text>

  <!-- bottom nav in sidebar -->
  <line x1="46" y1="738" x2="346" y2="738" stroke="#e2ddd3"/>
  <text x="70" y="772" class="b" style="font-weight:700;fill:#2f7564">Chats</text>
  <text x="130" y="772" class="b">Board</text>
  <text x="188" y="772" class="b">Arquivos</text>
  <text x="262" y="772" class="b">Tarefas</text>

  <!-- header -->
  <line x1="346" y1="104" x2="1154" y2="104" stroke="#e2ddd3"/>
  <text x="370" y="70" class="h">claude · tasknexus</text>
  <text x="370" y="90" class="s">~/projetos/tasknexus · pensando…</text>
  <rect x="822" y="56" width="150" height="32" rx="9" fill="#efece5"/>
  <rect x="825" y="59" width="72" height="26" rx="7" fill="#ffffff"/>
  <text x="844" y="77" class="b" style="font-weight:700">Chat</text>
  <text x="906" y="77" class="b" style="fill:#6b645c">Terminal</text>
  <rect x="984" y="56" width="84" height="32" rx="9" fill="none" stroke="#d8d3c8"/>
  <text x="998" y="77" class="b">Arquivos</text>
  <rect x="1076" y="56" width="62" height="32" rx="9" fill="none" stroke="#d8d3c8"/>
  <text x="1086" y="77" class="b">+ Card</text>

  <!-- user bubble -->
  <rect x="780" y="124" width="356" height="58" rx="16" fill="#d9eee6"/>
  <text x="798" y="148" class="b">Roda os testes do backend e me mostra</text>
  <text x="798" y="168" class="b">o que falhou, com link pro arquivo.</text>
  <text x="1096" y="196" class="s">14:10 ✓✓</text>

  <!-- assistant block -->
  <circle cx="382" cy="224" r="14" fill="#cfe6de"/><text x="373" y="229" class="s" style="font-weight:700;fill:#2f7564">CL</text>
  <!-- tool chips -->
  <rect x="406" y="210" width="224" height="28" rx="14" fill="#efece5"/>
  <text x="420" y="229" class="s" style="fill:#3b3530">▸ Executou  pytest -q   · 4,2 s</text>
  <rect x="638" y="210" width="190" height="28" rx="14" fill="#efece5"/>
  <text x="652" y="229" class="s" style="fill:#3b3530">▸ Leu 2 arquivos</text>

  <rect x="406" y="250" width="660" height="298" rx="16" fill="#ffffff" stroke="#e2ddd3"/>
  <text x="426" y="278" class="b">Rodei a suíte: <tspan style="font-weight:700">58 passaram, 2 falharam</tspan>. As duas falhas vêm do mesmo ponto:</text>
  <text x="426" y="300" class="b">a validação de caminho em <tspan class="lk m">backend/app/attachments.py:29</tspan> recusa links simbólicos.</text>
  <text x="426" y="322" class="b">Referência: <tspan class="lk">docs.python.org/3/library/os.path.html</tspan></text>
  <!-- code block -->
  <rect x="426" y="338" width="620" height="150" rx="10" fill="#26282e"/>
  <rect x="426" y="338" width="620" height="28" rx="10" fill="#33363d"/>
  <rect x="426" y="356" width="620" height="10" fill="#33363d"/>
  <text x="440" y="357" class="s" style="fill:#b9b4ab">python · attachments.py</text>
  <text x="896" y="357" class="s" style="fill:#e6e3dd">Abrir</text>
  <text x="946" y="357" class="s" style="fill:#e6e3dd">Copiar</text>
  <text x="1000" y="357" class="s" style="fill:#e6e3dd">⤢</text>
  <text x="440" y="388" class="c m"><tspan class="ck">def</tspan> _is_within_directory(base_dir, target_dir):</text>
  <text x="440" y="408" class="c m">    base = os.path.realpath(base_dir)</text>
  <text x="440" y="428" class="c m">    target = os.path.realpath(target_dir)</text>
  <text x="440" y="448" class="c m">    <tspan class="ck">return</tspan> os.path.commonpath([base, target]) == base</text>
  <text x="440" y="472" class="c m" style="fill:#8a8378"># … 12 linhas ocultas · tocar para expandir</text>
  <text x="426" y="514" class="b">Quer que eu corrija e rode de novo?</text>
  <text x="426" y="536" class="s">14:11 · 0,08 US$ · 12 s</text>

  <!-- approval card -->
  <rect x="406" y="566" width="660" height="104" rx="16" fill="#fdf6e6" stroke="#e5c77f" stroke-width="1.5"/>
  <text x="426" y="592" class="b" style="font-weight:700">Claude quer editar 1 arquivo</text>
  <text x="426" y="612" class="s m" style="fill:#6b645c">Edit · backend/app/attachments.py  (+6 −2)  · ver diff</text>
  <rect x="426" y="626" width="92" height="32" rx="9" fill="#ffffff" stroke="#d8d3c8"/>
  <text x="452" y="647" class="b">Negar</text>
  <rect x="528" y="626" width="150" height="32" rx="9" fill="#3f8f7c"/>
  <text x="548" y="647" class="b w" style="font-weight:700">Permitir uma vez</text>
  <rect x="688" y="626" width="200" height="32" rx="9" fill="#ffffff" stroke="#d8d3c8"/>
  <text x="704" y="647" class="b">Sempre nesta sessão</text>

  <!-- composer -->
  <rect x="370" y="700" width="760" height="78" rx="18" fill="#ffffff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="392" y="734" class="h" style="fill:#8a8378">＋</text>
  <text x="422" y="733" class="b" style="fill:#8a8378">Mensagem para claude…  ( / para comandos, @ para arquivos )</text>
  <text x="422" y="760" class="s">⌘↵ envia · ↵ nova linha no iPad · ditado do teclado funciona aqui</text>
  <circle cx="1098" cy="739" r="20" fill="#b9b4ab"/>
  <rect x="1090" y="731" width="16" height="16" rx="3" fill="#ffffff"/>

  <!-- annotations -->
  <text x="1090" y="118" class="ann" text-anchor="end">A</text>
  <text x="398" y="206" class="ann">B</text>
  <text x="1072" y="304" class="ann">C</text>
  <text x="1072" y="366" class="ann">D</text>
  <text x="1072" y="586" class="ann">E</text>
  <text x="1140" y="712" class="ann">F</text>
  <text x="56" y="232" class="ann">G</text>
</svg>
